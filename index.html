<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d6a3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Microverdeață">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
<title>Program Microverdeață</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Calendar zilnic de semănat, udat și recoltat pentru tăvile de microverdeață, cu lista de plante editabilă, estimare de recoltă și rețetă de mix pentru caserole de 60 g și 100 g.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: aplicație pentru telefon, 4 file jos (Azi, Program, Apă, Setări); conținutul curge pe o singură coloană,
   tabelele au prima coloană fixă și derulează orizontal în containerul lor. Lista de plante se editează în Setări. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#1b261d; --muted:#5d6b60; --line:#d9dfd6;
  --accent:#2d6a3e; --accent-fg:#ffffff; --today:#d92d20; --today-fg:#ffffff; --soft:#e7ede4;
  --s-bg:#6b4f33; --s-fg:#ffffff;
  --i-bg:#4b7fb3; --i-fg:#ffffff;
  --p-bg:#bfe3ea; --p-fg:#10303a;
  --l-bg:#f1c24b; --l-fg:#2b2100;
  --u-bg:#dbe9f6; --u-fg:#12304d;
  --r-bg:#1b261d; --r-fg:#ffffff;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --surface:#18211b; --fg:#e8efe9; --muted:#9bab9f; --line:#2b372e; --soft:#202c23;
    --accent:#6fcf88; --accent-fg:#0b1a10; --today:#ff5a4d; --today-fg:#ffffff;
    --s-bg:#a98660; --s-fg:#1a1208; --i-bg:#6aa2d6; --i-fg:#08192b;
    --p-bg:#25525c; --p-fg:#d9f1f5; --l-bg:#d6a526; --l-fg:#1d1500;
    --u-bg:#1f3a54; --u-fg:#d8e9f9; --r-bg:#e8efe9; --r-fg:#101612;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --fg:#e8efe9; --muted:#9bab9f; --line:#2b372e; --soft:#202c23;
  --accent:#6fcf88; --accent-fg:#0b1a10; --today:#ff5a4d; --today-fg:#ffffff;
  --s-bg:#a98660; --s-fg:#1a1208; --i-bg:#6aa2d6; --i-fg:#08192b;
  --p-bg:#25525c; --p-fg:#d9f1f5; --l-bg:#d6a526; --l-fg:#1d1500;
  --u-bg:#1f3a54; --u-fg:#d8e9f9; --r-bg:#e8efe9; --r-fg:#101612;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 96px}
main{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.top h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.top .tray{font-size:.78rem;color:var(--muted)}
/* day header */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px}
.hero .nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;line-height:1}
.hero .nav:disabled{opacity:.35;cursor:default}
.hero .mid{flex:1;text-align:center;min-width:0}
.hero .big{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;letter-spacing:-.02em}
.hero .big small{font-size:1rem;font-weight:500;color:var(--muted);letter-spacing:0}
.hero .date{color:var(--muted);font-size:.95rem;margin-top:4px}
.hero .date::first-letter{text-transform:uppercase}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;margin-top:8px;background:var(--soft);color:var(--muted)}
.tag.now{background:var(--today);color:var(--today-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.today{box-shadow:inset 0 -3px 0 var(--today)}
.notice{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--soft);font-size:.95rem}
.notice.warn{background:var(--today);color:var(--today-fg);font-weight:600}
/* totals */
.total{margin-top:12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 2px}
.total .n{font-family:var(--display);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums}
.total .s{color:var(--muted);font-size:.85rem;text-align:right}
/* task groups */
.group{margin-top:18px}
.group h2{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.group .hint{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.badge{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;font-weight:700;font-size:.9rem;padding:0 6px}
.c-S{background:var(--s-bg);color:var(--s-fg)} .c-Î{background:var(--i-bg);color:var(--i-fg)}
.c-P{background:var(--p-bg);color:var(--p-fg)} .c-L{background:var(--l-bg);color:var(--l-fg)}
.c-U{background:var(--u-bg);color:var(--u-fg)} .c-R{background:var(--r-bg);color:var(--r-fg)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:50px}
.rows li+li{border-top:1px solid var(--line)}
.rows .pn{font-weight:600;min-width:0}
.rows .pn small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.rows .amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.empty{margin-top:24px;color:var(--muted);text-align:center}
/* tables */
.sec-title{font-size:1.25rem;margin-bottom:4px}
.sec-sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
th,td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:44px;min-width:56px;font-size:.9rem}
tr>*:last-child{border-right:0}
tbody tr:last-child>*{border-bottom:0}
thead th{background:var(--fg);color:var(--bg);font-weight:600;position:sticky;top:0}
thead th button{all:unset;display:block;width:100%;height:44px;line-height:44px;cursor:pointer}
thead th.today{background:var(--today);color:var(--today-fg)}
thead tr.dates th{background:var(--soft);color:var(--muted);font-size:.72rem;font-weight:500;height:26px}
thead tr.dates th.today{background:var(--today);color:var(--today-fg)}
th.pl,td.pl{position:sticky;left:0;z-index:2;text-align:left;padding:0 12px;min-width:132px;max-width:160px;font-weight:600;background:var(--surface);box-shadow:1px 0 0 var(--line)}
thead th.pl{background:var(--fg);color:var(--bg);z-index:3}
thead tr.dates th.pl{background:var(--soft);color:var(--muted)}
td.today{box-shadow:inset 3px 0 0 var(--today),inset -3px 0 0 var(--today)}
tbody tr:last-child td.today,tr.sum td.today{box-shadow:inset 3px 0 0 var(--today),inset -3px 0 0 var(--today),inset 0 -3px 0 var(--today)}
td.c-S,td.c-Î,td.c-P,td.c-L,td.c-U,td.c-R{font-weight:700}
td .sm{display:block;font-size:.62rem;font-weight:500;opacity:.8;line-height:1}
tr.sum td,tr.sum th{background:var(--soft);font-weight:700}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px;margin-top:14px;font-size:.88rem}
.legend div{display:flex;align-items:center;gap:10px}
/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h3{font-size:1.05rem;margin-bottom:8px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=date],input[type=number],input[type=text],select{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:0 12px}
select{appearance:auto}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:0 16px;margin-top:12px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--today);border-color:var(--today);background:var(--surface)}
.btn.danger.armed{background:var(--today);color:var(--today-fg)}
.btn.full{width:100%}
.fine{color:var(--muted);font-size:.85rem;margin-top:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.pcard.off{opacity:.6}
.phead{display:flex;gap:10px;align-items:center}
.phead input[type=text]{flex:1;min-width:0;font-weight:700;background:var(--l-bg);color:var(--l-fg);border-color:var(--l-bg)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pgrid label{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.pgrid input{text-align:center;height:44px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;font-size:.95rem;margin:0;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.checks{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px}
.manual{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.manual .mh{font-weight:700;font-size:.9rem}
.manual .mh span{font-weight:500;color:var(--muted);font-size:.8rem}
.pgrid.p3{grid-template-columns:1fr;gap:8px;margin-top:8px}
.pgrid.p3 label{font-size:.8rem}
.pgrid.p3 input{text-align:left;padding:0 12px}
.plist-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:22px}
.plist-head h3{font-size:1.1rem}
.plist-head span{color:var(--muted);font-size:.85rem}
.toast{margin-top:10px;color:var(--accent);font-weight:600;font-size:.9rem;min-height:1.2em}
/* recoltă + mix */
.prows{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px}
.prow{padding:12px 14px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .l1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prow .nm{font-weight:600;min-width:0}
.step{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;line-height:1;font-weight:600;padding:0}
.step input{width:58px;height:44px;text-align:center;padding:0;font-weight:700;font-size:1.1rem}
.prow .l2{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;margin-top:8px}
.prow label.yg{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:500;margin:0}
.prow label.yg input{width:76px;height:40px;text-align:center;padding:0}
.prow .est{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.mixrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.mixrow .lab{font-weight:600}
.seg{margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{height:46px;border:0;border-radius:9px;background:none;font-weight:600;font-size:.85rem;color:var(--muted);padding:0 6px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--muted)}
.stat.bad{background:var(--today);color:var(--today-fg)} .stat.bad span{color:inherit}
table.rt{margin-top:12px}
table.rt th,table.rt td{min-width:40px;padding:0 3px;font-size:.84rem}
table.rt th.pl,table.rt td.pl{min-width:92px;max-width:104px;padding:0 8px;line-height:1.2}
table.rt .dim{opacity:.4}
table.rt input{width:54px;height:38px;text-align:center;padding:0;font-weight:600}
details summary{list-style-position:inside}
table.rt td.warn{color:var(--today);font-weight:700}
/* bottom nav */
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;border-radius:12px;height:52px;font-weight:600;font-size:.76rem;padding:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--accent);background:var(--soft)}
@media (prefers-reduced-motion:no-preference){.rows li,.hero{transition:background .15s}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Microverdeață</h1><span class="tray">tavă 30,5 × 22,5 cm</span></div>
  <section id="v-azi"></section>
  <section id="v-prog" hidden></section>
  <section id="v-apa" hidden></section>
  <section id="v-rec" hidden></section>
  <section id="v-set" hidden></section>
</main>

<nav role="tablist" aria-label="Secțiuni">
  <button role="tab" data-tab="azi" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Azi</button>
  <button role="tab" data-tab="prog" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 4v16"/></svg>Program</button>
  <button role="tab" data-tab="apa" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3.5c3 3.7 5.5 6.5 5.5 9.8a5.5 5.5 0 0 1-11 0C6.5 10 9 7.2 12 3.5Z"/></svg>Apă</button>
  <button role="tab" data-tab="rec" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3.5 9.5h17l-1.7 9.2a2 2 0 0 1-2 1.6H7.2a2 2 0 0 1-2-1.6Z"/><path d="M8 9.5l3-5M16 9.5l-3-5M9.5 13v3.5M14.5 13v3.5"/></svg>Recoltă</button>
  <button role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setări</button>
</nav>

<script>
(function(){
  var KEY="microverdeata-v2", OLD="microverdeata-v1", DEF_START="2026-10-15";
  var ACTION={S:"Semeni + pulverizezi","Î":"Înmoi semințele seara",P:"Pulverizezi",L:"Scoți la lumină + uzi",U:"Uzi de jos",R:"Recoltezi"};
  var HINT={S:"Acoperi tăvile, fără lumină.","Î":"8–12 ore, le semeni a doua zi.",P:"De 2 ori pe zi (dimineața și seara), în întuneric.",
    L:"Tăvile ies din întuneric. De azi uzi de jos.",U:"O dată pe zi, de jos: torni în tava de dedesubt, aștepți 15–20 min și arunci restul.",R:"Tai dimineața, fără să mai uzi."};
  var ORDER=["R","L","U","P","S","Î"];

  /* zile = zile până la recoltare; dark = zile în întuneric; sp = ml per pulverizare; wa = ml udare de jos pe zi;
     yg = grame recoltate dintr-o tavă (estimare orientativă, se corectează după cântărire) */
  var DEFAULTS=[
    {name:"Rucola",grow:12,dark:4,soak:false,weight:false,sp:17,wa:70,yg:75,seed:8},
    {name:"Amarant",grow:12,dark:4,soak:false,weight:false,sp:13,wa:60,yg:50,seed:4},
    {name:"Pak Choi",grow:10,dark:3,soak:false,weight:false,sp:17,wa:80,yg:85,seed:10},
    {name:"Mazăre",grow:10,dark:4,soak:true,weight:true,sp:26,wa:170,yg:150,seed:150},
    {name:"Fasole și Mazăre",grow:10,dark:4,soak:true,weight:true,sp:26,wa:170,yg:150,seed:150},
    {name:"Broccoli",grow:9,dark:3,soak:false,weight:false,sp:17,wa:80,yg:75,seed:13},
    {name:"Gulie Kohlrabi",grow:9,dark:3,soak:false,weight:false,sp:17,wa:80,yg:80,seed:14},
    {name:"Varză Albă",grow:9,dark:3,soak:false,weight:false,sp:17,wa:80,yg:80,seed:13},
    {name:"Floarea-soarelui",grow:9,dark:3,soak:true,weight:false,sp:26,wa:130,yg:150,seed:90},
    {name:"Muștar",grow:8,dark:3,soak:false,weight:false,sp:17,wa:70,yg:90,seed:14},
    {name:"Ridiche Daikon",grow:7,dark:3,soak:false,weight:false,sp:17,wa:80,yg:100,seed:15},
    {name:"Ridiche Purpurie",grow:7,dark:3,soak:false,weight:false,sp:17,wa:80,yg:95,seed:15},
    {name:"Fasole Mung",grow:6,dark:4,soak:true,weight:false,sp:26,wa:170,yg:200,seed:90}
  ];
  /* valori orientative pentru plante frecvente; se pot edita după adăugare */
  var EXTRA=[
    {name:"Hrișcă",grow:9,dark:3,soak:true,weight:false,sp:22,wa:95,yg:125,seed:80},
    {name:"Sfeclă roșie",grow:11,dark:4,soak:true,weight:false,sp:17,wa:85,yg:60,seed:25},
    {name:"Varză roșie",grow:9,dark:3,soak:false,weight:false,sp:17,wa:80,yg:80,seed:13},
    {name:"Creson",grow:7,dark:2,soak:false,weight:false,sp:13,wa:60,yg:85,seed:20},
    {name:"Lucernă",grow:8,dark:3,soak:false,weight:false,sp:13,wa:60,yg:75,seed:14},
    {name:"Linte",grow:7,dark:3,soak:true,weight:false,sp:22,wa:105,yg:125,seed:85},
    {name:"Năut",grow:7,dark:3,soak:true,weight:false,sp:26,wa:130,yg:150,seed:150},
    {name:"Busuioc",grow:14,dark:3,soak:false,weight:false,sp:13,wa:60,yg:45,seed:6},
    {name:"Coriandru",grow:15,dark:5,soak:false,weight:false,sp:17,wa:80,yg:50,seed:25}
  ];
  /* lista de adăugare conține și cele 12 plante din lista de pornire, ca să le poți readăuga dacă le ștergi */
  var PRESETS=DEFAULTS.concat(EXTRA);
  /* rețetele celor 5 mixuri: [plantă, grame la caserola de 100 g, grame la caserola de 60 g] */
  var RECIPES=[
    {id:"mix1",name:"Mix 1 · echilibrat",lines:[["Mazăre",30,20],["Pak Choi",20,12],["Broccoli",15,10],["Rucola",12,8],["Amarant",8,5],["Ridiche Purpurie",8,5],["Muștar",7,0]]},
    {id:"mix2",name:"Mix 2 · picant",lines:[["Rucola",25,15],["Muștar",20,12],["Ridiche Purpurie",20,12],["Ridiche Daikon",15,11],["Pak Choi",12,10],["Amarant",8,0]]},

  /* ---------- programul calculat ---------- */
  /* Planta cu creșterea cea mai lungă se seamănă în ziua 1; toate ajung la recoltare în aceeași zi (ultima).
     Dacă planta cea mai lungă se înmoaie, programul începe cu ziua de înmuiere. */
  function sched(sync){
    var act=state.plants.filter(function(p){return p.on;});
    if(!act.length){if(!sync)state.shift=0;return{N:0,rows:[],longest:[]};}
    var maxG=Math.max.apply(null,act.map(function(p){return p.grow;}));
    var off=act.some(function(p){return p.soak&&p.grow===maxG;})?1:0;
    var H=maxG+1+off;
    /* zilele automate (asow, alight, aharv) pot fi înlocuite pe fiecare plantă cu date alese manual.
       Numărătoarea zilelor pornește de la data de start; dacă o plantă a fost semănată mai devreme,
       numărătoarea se mută înapoi (state.shift) ca toate zilele să rămână pozitive. */
    var raw=act.map(function(p){
      var asow=H-p.grow,alight=asow+p.dark+1,aharv=H;
      var sd=sync?null:p.sowDate,ld=sync?null:p.lightDate;
      var sow=sd?relDay(sd):asow;
      var harv=Math.max(sd?sow+p.grow:aharv,sow+1);
      var light=Math.min(Math.max(ld?relDay(ld):(sd?sow+p.dark+1:alight),sow+1),Math.max(sow+1,harv-1));
      return{p:p,sow:sow,light:light,harv:harv,asow:asow,alight:alight,aharv:aharv};
    });

    var shift=first<1?1-first:0;if(!sync)state.shift=shift;

      var p=r.p,codes={};
      if(p.soak&&r.sow-1>=1)codes[r.sow-1]="Î";
      codes[r.sow]="S";
      for(var d=r.sow+1;d<r.harv;d++)codes[d]=d<r.light?"P":(d===r.light?"L":"U");
      codes[r.harv]="R";

    });

  /* ---------- Recoltă + mix ---------- */
  function allocate(fr,size){
    var raw=fr.map(function(f){return f*size;}),fl=raw.map(Math.floor),
      left=size-fl.reduce(function(a,b){return a+b;},0),
      idx=raw.map(function(r,i){return i;}).sort(function(a,b){return(raw[b]-fl[b])-(raw[a]-fl[a]);});
    for(var k=0;k<left&&k<idx.length;k++)fl[idx[k]]++;
    return fl;
  }
  /* împarte T grame în mod egal, fără să depășești recolta (caps) fiecărei plante */
  function fill(caps,T){
    var res=caps.map(function(){return 0;}),open=caps.map(function(c,i){return i;}),rem=T;
    while(open.length){
      var lvl=rem/open.length,small=open.filter(function(i){return caps[i]<=lvl+1e-9;});
      if(!small.length){open.forEach(function(i){res[i]=lvl;});break;}
      small.forEach(function(i){res[i]=caps[i];rem-=caps[i];});
      open=open.filter(function(i){return small.indexOf(i)<0;});
    }
    return res;
  }
  function calcRec(){
    var items=state.plants.filter(function(p){return p.on;}).map(function(p){return{p:p,h:p.trays*p.yg};});
    var sum=function(a,f){return a.reduce(function(s,x){return s+f(x);},0);};
    var mixIt=items.filter(function(x){return x.p.mix&&x.h>0;}),m=state.mix;
    var R={items:items,est:sum(items,function(x){return x.h;}),trays:sum(items,function(x){return x.p.trays;}),
      A:sum(mixIt,function(x){return x.h;}),mixTrays:sum(mixIt,function(x){return x.p.trays;}),G:60*m.c60+100*m.c100,rows:[]};
    if(R.A>0){
      var T=R.G>0?Math.min(R.G,R.A):Math.min(60,R.A),hs=mixIt.map(function(x){return x.h;}),
        sh=m.mode==="egal"?fill(hs,T):hs.map(function(h){return T*h/R.A;}),
        fr=sh.map(function(s){return s/T;}),a60=allocate(fr,60),a100=allocate(fr,100);
      R.rows=mixIt.map(function(x,i){
        var tot=a60[i]*m.c60+a100[i]*m.c100;
        return{p:x.p,h:x.h,g60:a60[i],g100:a100[i],tot:tot,tr:x.p.yg?tot/x.p.yg:0,over:R.G<=R.A&&tot>x.h+0.5};
      });
    }
    return R;
  }

        h+='<div class="notice warn">Nu ajunge recolta pentru toate caserolele. Mai ai nevoie de ≈ '+trTxt(need)+' (la randamentul mediu al plantelor din mix) sau reduci caserolele.</div>';

      R.rows.forEach(function(r){
        s60+=r.g60;s100+=r.g100;st+=r.tot;str+=r.tr;if(r.over)anyOver=true;

          '<td class="'+(r.over?"warn":"")+'">'+(r.over?"⚠ ":"")+r.tot+' g</td><td>'+fmt1(r.tr)+'</td></tr>';

      h+='<tr class="sum"><th class="pl">Total</th><td class="'+(m.c60?"":"dim")+'">'+s60+' g</td><td class="'+(m.c100?"":"dim")+'">'+s100+' g</td><td>'+st+' g</td><td>'+fmt1(str)+'</td></tr></tbody></table></div>';

  /* ---------- rețetele de mix ---------- */
  function findPlant(name){var n=String(name).toLowerCase();for(var i=0;i<state.plants.length;i++)if(state.plants[i].name.toLowerCase()===n)return state.plants[i];return null;}
  function rcById(id){for(var i=0;i<state.recipes.length;i++)if(state.recipes[i].id===id)return state.recipes[i];return null;}
  function rcCalc(){
    var need={},order=[],cas=0,gr=0,all=[];
    state.recipes.forEach(function(r){
      cas+=r.c100+r.c60;gr+=100*r.c100+60*r.c60;
      r.lines.forEach(function(l){
        if(all.indexOf(l.n)<0)all.push(l.n);
        var g=l.a*r.c100+l.b*r.c60;if(!(l.n in need)){need[l.n]=0;order.push(l.n);}need[l.n]+=g;
      });
    });
    var rows=order.filter(function(n){return need[n]>0;}).map(function(n){
      var p=findPlant(n),act=p&&p.on;
      return{n:n,need:need[n],p:p,act:act,have:act?p.trays*p.yg:0,
        tn:(act&&p.yg>0)?Math.ceil(need[n]*1.1/p.yg-1e-9):null};
    });
    var missing=all.filter(function(n){return !findPlant(n);});
    return{rows:rows,cas:cas,gr:gr,missing:missing};
  }

      });

    });

    if(C.missing.length)h+='<div class="notice warn">Lipsesc din lista ta: '+esc(C.missing.join(", "))+'.</div><button class="btn full" data-act="addmissing">Adaugă plantele care lipsesc ('+C.missing.length+')</button>';
    if(C.rows.length){
      h+='<h3 style="margin-top:18px;font-size:1rem">Necesar total pe plante</h3><div class="scroll"><table class="rt"><thead><tr><th class="pl">Plantă</th><th>Necesar</th><th>Ai</th><th>±</th><th>Tăvi</th></tr></thead><tbody>';

  function patchPlant(id,obj){
    for(var i=0;i<state.plants.length;i++)if(state.plants[i].id===id){state.plants[i]=clean(Object.assign({},state.plants[i],obj));return state.plants[i];}

  function bindRec(){
    var el=$("v-rec");
    el.addEventListener("toggle",function(e){var d=e.target;if(d&&d.tagName==="DETAILS"&&d.dataset.rc)state.openRc[d.dataset.rc]=d.open;},true);
    el.onclick=function(e){
      var b=e.target.closest?e.target.closest("button"):null;if(!b||!el.contains(b))return;
      if(b.dataset.mode){state.mix.mode=b.dataset.mode;state.armedClear=false;save();renderRec();return;}
      var a=b.dataset.act;
      if(b.dataset.rc){
        var rr=rcById(b.dataset.rc);if(!rr)return;state.armedClear=false;state.armedTrays=false;
        if(a==="rcreset"){var d0=null;for(var q=0;q<RECIPES.length;q++)if(RECIPES[q].id===rr.id)d0=RECIPES[q];if(d0){rr.lines=defLines(d0);}}
        else if(b.dataset.k){rr[b.dataset.k]=toInt(rr[b.dataset.k]+(a==="inc"?1:-1),0,0,99);}
        save();renderRec();return;
      }
      if(a==="addmissing"){
        rcCalc().missing.forEach(function(n){for(var i=0;i<PRESETS.length;i++)if(PRESETS[i].name.toLowerCase()===n.toLowerCase()){state.plants.push(clean(Object.assign({},PRESETS[i],{id:newId(),on:true})));break;}});
        save();refresh();return;
      }
      if(a==="settrays"){
        if(!state.armedTrays){state.armedTrays=true;renderRec();return;}
        state.armedTrays=false;
        rcCalc().rows.forEach(function(x){if(x.act&&x.tn!=null)patchPlant(x.p.id,{trays:x.tn});});
        save();refresh();return;
      }
      if(a==="inc"||a==="dec"){
        var dlt=a==="inc"?1:-1;state.armedClear=false;
        if(b.dataset.mix){state.mix[b.dataset.mix]=toInt(state.mix[b.dataset.mix]+dlt,0,0,99);}
        else{for(var i=0;i<state.plants.length;i++)if(state.plants[i].id===b.dataset.id){patchPlant(b.dataset.id,{trays:state.plants[i].trays+dlt});break;}}
        save();refreshAfterRec();return;
      }
      if(a==="clear"){
        if(!state.armedClear){state.armedClear=true;renderRec();return;}
        state.armedClear=false;state.plants=state.plants.map(function(p){return clean(Object.assign({},p,{trays:0}));});save();refreshAfterRec();
      }
    };
    el.onchange=function(e){
      var t=e.target;state.armedClear=false;state.armedTrays=false;
      if(t.dataset.rc){
        var r2=rcById(t.dataset.rc);if(!r2)return;
        if(t.dataset.k)r2[t.dataset.k]=toInt(t.value,0,0,99);
        else if(t.dataset.li!==undefined&&r2.lines[+t.dataset.li])r2.lines[+t.dataset.li][t.dataset.col]=toInt(t.value,0,0,t.dataset.col==="a"?100:60);
        else return;
        save();renderRec();return;
      }
      if(t.dataset.mix){state.mix[t.dataset.mix]=toInt(t.value,0,0,99);}
      else if(t.dataset.f){var o={};o[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;patchPlant(t.dataset.id,o);}

      '<div class="plist-head"><h3>Plantele tale</h3><span>'+n+' din '+state.plants.length+' în program</span></div>'+
      '<p class="fine">Bifează „În program” doar pentru plantele pe care le semeni acum. Programul se aranjează singur ca toate să se recolteze în aceeași zi, dar la fiecare plantă poți introduce data semănatului. Scoaterea la lumină și recolta se calculează din ea, iar data luminii o poți schimba.</p>';
    state.plants.forEach(function(p,i){h+=plantCard(p,i);});
    h+='<div class="card" id="addCard"><h3>Adaugă o plantă</h3><label for="preset">Alege din listă sau pornești de la zero</label>'+
      '<select id="preset"><option value="-1">Plantă nouă, completez eu valorile</option>'+
      PRESETS.map(function(p,i){var has=state.plants.some(function(x){return x.name===p.name;});return'<option value="'+i+'">'+esc(p.name)+' ('+p.grow+' zile)'+(has?' · în listă':'')+'</option>';}).join("")+'</select>'+
      '<button class="btn primary full" id="add">Adaugă în listă</button>'+
      '<p class="fine">Valorile din listă sunt orientative. După adăugare le poți schimba în cardul plantei.</p><div class="toast" id="toast">'+esc(state.toast)+'</div></div>'+
      '<button class="btn danger full'+(state.armedReset?" armed":"")+'" id="reset">'+(state.armedReset?"Apasă încă o dată pentru a confirma":"Revino la lista și valorile implicite")+'</button>'+
      '<p class="fine">Setările rămân memorate pe acest telefon, în acest browser.</p>';
    el.innerHTML=h;
    $("startDate").onchange=function(e){var v=validDate(e.target.value);if(v){state.start=v;save();resetView();refresh();syncAuto();}};
    state.plants.forEach(function(p,i){bindCard(p,i);});
    syncAuto();
    $("add").onclick=function(){
      var k=+$("preset").value,base=k>=0?PRESETS[k]:{name:"Plantă nouă",grow:9,dark:3,soak:false,weight:false,sp:20,wa:90};
      var np=clean(Object.assign({},base,{id:newId(),on:true}));
      state.plants.push(np);save();refresh();
      state.toast="Adăugat: "+np.name+". Ajustează valorile în cardul de mai sus.";
      renderSet();
      var c=$("card"+(state.plants.length-1));if(c&&c.scrollIntoView)try{c.scrollIntoView({block:"center"});}catch(e){}
    };
    var rb=$("reset");
    rb.onclick=function(){
      if(!state.armedReset){state.armedReset=true;renderSet();return;}
      state.armedReset=false;state.armedDel=null;state.start=DEF_START;state.plants=defaults();state.mix=cleanMix();state.recipes=defRecipes();state.toast="Lista și valorile implicite au fost restabilite.";save();refresh();renderSet();
    };
  }
  /* arată zilele efective și valorile automate (placeholder) pentru toate plantele */
  function syncAuto(){
    var SC=sched(),f=function(d){return fShort.format(dayDate(d));};
    state.plants.forEach(function(p,i){
      var r=null;for(var k=0;k<SC.rows.length;k++)if(SC.rows[k].p.id===p.id)r=SC.rows[k];
      var e=$("eff"+i);
      if(e)e.innerHTML=r?"Acum: semănat "+f(r.sow)+" · lumină "+f(r.light)+" · recoltă "+f(r.harv)+" (zilele "+r.sow+", "+r.light+", "+r.harv+")<br>Automat: semănat "+f(r.asow)+" · lumină "+f(r.alight)+" · recoltă "+f(r.aharv):"Planta nu e în program.";
    });
  }
  function syncCard(p,i){
    var set=function(id,v){var e=$(id+i);if(e&&e!==document.activeElement)e.value=v;else if(e)e.value=v;};
    set("nm",p.name);set("gr",p.grow);set("dk",p.dark);set("sp",p.sp);set("wa",p.wa);set("se",p.seed);
    set("sd",p.sowDate||"");set("ld",p.lightDate||"");
    var c=$("card"+i);if(c)c.classList.toggle("off",!p.on);
  }
  function bindCard(p,i){
    function upd(patch){
      var cur=state.plants[i];if(!cur)return;
      var np=clean(Object.assign({},cur,patch));
      state.plants[i]=np;save();syncCard(np,i);resetView();refresh();syncAuto();
      var cnt=document.querySelector(".plist-head span");if(cnt)cnt.textContent=state.plants.filter(function(x){return x.on;}).length+" din "+state.plants.length+" în program";
    }
    $("nm"+i).onchange=function(e){upd({name:e.target.value});};
    $("on"+i).onchange=function(e){upd({on:e.target.checked});};
    $("gr"+i).onchange=function(e){upd({grow:e.target.value});};
    $("dk"+i).onchange=function(e){upd({dark:e.target.value});};
    $("sp"+i).onchange=function(e){upd({sp:e.target.value});};
    $("wa"+i).onchange=function(e){upd({wa:e.target.value});};
    $("se"+i).onchange=function(e){upd({seed:e.target.value});};
    $("sd"+i).onchange=function(e){upd({sowDate:e.target.value});};
    $("ld"+i).onchange=function(e){upd({lightDate:e.target.value});};
    $("rs"+i).onclick=function(){upd({sowDate:null,lightDate:null});};
    $("so"+i).onchange=function(e){upd({soak:e.target.checked});};
    $("wt"+i).onchange=function(e){upd({weight:e.target.checked});};
    $("del"+i).onclick=function(){
      var cur=state.plants[i];if(!cur)return;
      if(state.armedDel!==cur.id){state.armedDel=cur.id;renderSet();return;}
      state.armedDel=null;state.plants.splice(i,1);state.toast="";save();refresh();renderSet();
    };
  }

  /* ---------- Navigare ---------- */
  function refresh(){renderAzi();renderProg();renderApa();renderRec();}
  function showTab(t){
    state.tab=t;state.armedClear=false;state.armedTrays=false;
    ["azi","prog","apa","rec","set"].forEach(function(k){$("v-"+k).hidden=(k!==t);});
    Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.setAttribute("aria-selected",String(b.dataset.tab===t));});
    if(t==="set"){state.armedDel=null;state.armedReset=false;state.toast="";renderSet();}
    else refresh();
    window.scrollTo(0,0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){showTab(b.dataset.tab);};});

  load();
  bindRec();
  resetView();
  refresh();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
